name: build-test

on: [pull_request]

permissions:
  contents: read    # Required to checkout code

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install Node
      uses: actions/setup-node@v3
      with:
        node-version: 24.19.0
        cache: 'npm'
    - name: install dependencies
      run: yarn install --frozen-lockfile
    - name: lint
      run: yarn lint
    - name: format
      run: yarn format
    - name: typecheck
      run: yarn typecheck
    - name: test
      run: yarn test --run
    - name: build
      run: yarn ui-build
